name: Publicar AguaFix en Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Evita que una ejecución anterior sobrescriba latest después de otra más nueva.
concurrency:
  group: docker-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar latest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USER }}/aguafix-api:latest

      - name: Comprobar imagen publicada
        env:
          IMAGE: ${{ secrets.DOCKER_USER }}/aguafix-api:latest
        run: >-
          docker run --rm --pull always --entrypoint node "$IMAGE"
          -e 'require("@aws-sdk/client-s3"); require("@nestjs/core"); require("bcryptjs"); require("nodemailer"); require("typeorm"); console.log("Imagen publicada: dependencias cargadas correctamente");'
