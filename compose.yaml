services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: water
      POSTGRES_PASSWORD: water_local_only
      POSTGRES_DB: water_reports
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - water_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d water_reports"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  water_data:
